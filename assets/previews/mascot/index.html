</style></head><body><main><header><div><h1>Owllowance</h1><p class="muted">A sleepy companion by day. Attentive by night.</p></div><div class="controls"><label>Time <select id="mode"><option value="day">Day</option><option value="night">Night</option><option value="auto">Automatic</option></select></label><label><input id="reduce" type="checkbox">Still reactions</label></div></header>
